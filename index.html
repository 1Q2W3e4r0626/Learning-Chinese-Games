.ask{font-size:16px;color:var(--muted)}

.row{display:flex;gap:10px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.hide{display:none!important}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.big{font-size:44px;text-align:center;margin:6px 0}

const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
// ---- pinyin tone variants
const MARK={'\u0304':1,'\u0301':2,'\u030c':3,'\u0300':4},TM={a:['ā','á','ǎ','à'],e:['ē','é','ě','è'],i:['ī','í','ǐ','ì'],o:['ō','ó','ǒ','ò'],u:['ū','ú','ǔ','ù'],'ü':['ǖ','ǘ','ǚ','ǜ']};
function split(py){const d=py.normalize('NFD');let tone=0,base='';for(const ch of d){if(MARK[ch])tone=MARK[ch];else base+=ch}return{base:base.normalize('NFC'),tone}}
function withTone(base,t){if(t===0)return base;let k=base.indexOf('a');if(k<0)k=base.indexOf('e');if(k<0&&base.includes('ou'))k=base.indexOf('o');if(k<0){for(let i=base.length-1;i>=0;i--)if('aeiouü'.includes(base[i])){k=i;break}}return base.slice(0,k)+TM[base[k]][t-1]+base.slice(k+1)}
function toneVariants(py){const{base,tone}=split(py);return[1,2,3,4].filter(t=>t!==tone).map(t=>withTone(base,t))}
function makeOptions(c){const right=PY[c];const used=new Set([right]);const out=[right];
 const tv=shuffle(toneVariants(right));out.push(tv[0]);used.add(tv[0]);
 const others=shuffle([...new Set(Object.values(PY))]).filter(p=>!used.has(p));
 while(out.length<4){const p=others.pop();if(!used.has(p)){used.add(p);out.push(p)}}
 return shuffle(out)}
// ---- glyph drawing
const T='scale(1,-1) translate(0,-900)';
function grid(){return '<rect x="6" y="6" width="1012" height="1012" rx="30" fill="none" stroke="#e57373" stroke-width="10"/><g stroke="#ef9a9a" stroke-width="6" stroke-dasharray="26 22"><path d="M512 6V1018M6 512H1018M6 6L1018 1018M1018 6L6 1018" opacity=".55"/></g>'}
function staticSvg(c,bare){const g=D[c].s.map(d=>`<path d="${d}"/>`).join('');return `<svg viewBox="0 0 1024 1024" role="img" aria-label="${c}">${bare?'':grid()}<g transform="translate(60,60) scale(.883)"><g transform="${T}" fill="currentColor" style="color:var(--ink)">${g}</g></g></svg>`}
function animSvg(c){const o=D[c];let clips='',ghost='',lines='';
 o.s.forEach((d,i)=>{clips+=`<clipPath id="cp${i}"><path d="${d}"/></clipPath>`;ghost+=`<path d="${d}" fill="var(--ghost)"/>`;
  lines+=`<path class="ln" data-i="${i}" d="M${o.m[i].map(p=>p.join(' ')).join(' L')}" clip-path="url(#cp${i})" fill="none" stroke="var(--hl)" stroke-width="170" stroke-linecap="round" stroke-linejoin="round"/>`});
 return `<svg viewBox="0 0 1024 1024" role="img" aria-label="${c} 的笔顺动画">${grid()}<g transform="translate(60,60) scale(.883)"><g transform="${T}"><defs>${clips}</defs>${ghost}${lines}</g></g></svg>`}
let animToken=0;
function play(c){const box=$('dsvg');box.innerHTML=animSvg(c);const tok=++animToken;const ls=[...box.querySelectorAll('.ln')];
 ls.forEach(l=>{const L=l.getTotalLength()+2;l.style.strokeDasharray=L;l.style.strokeDashoffset=L;l.dataset.len=L;l.style.opacity=0});
 let i=0;const step=()=>{if(tok!==animToken)return;if(i>=ls.length)return;const l=ls[i],L=+l.dataset.len,dur=Math.min(900,Math.max(380,L*1.1));
  l.style.opacity=1;l.getBoundingClientRect();l.style.transition=`stroke-dashoffset ${dur}ms linear`;l.style.strokeDashoffset=0;
  setTimeout(()=>{if(tok!==animToken)return;l.style.stroke='var(--ink)';i++;step()},dur+160)};
 setTimeout(step,250)}
function openStroke(c,hide){$('dt').textContent=hide?`${c}　共 ${D[c].s.length} 画`:`${c}  ${PY[c]}　共 ${D[c].s.length} 画`;$('dwords').classList.toggle('hide',!!hide);$('dlg').dataset.c=c;$('dlg').showModal();play(c)}
$('replay').onclick=()=>play($('dlg').dataset.c);
$('dx').onclick=()=>{animToken++;$('dlg').close()};
$('dlg').addEventListener('close',()=>{animToken++});
// ---- speech (only on correct answers)
let voice=null;function pickVoice(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(c){speakText(SAY[c]||c)}
function speakText(t){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';if(voice)u.voice=voice;u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
// ---- 词组
const WORDS={春:[['春天','chūn tiān'],['春风','chūn fēng']],冬:[['冬天','dōng tiān'],['冬雪','dōng xuě']],吹:[['吹风','chuī fēng'],['吹气','chuī qì']],花:[['花朵','huā duǒ'],['红花','hóng huā']],飞:[['飞鸟','fēi niǎo'],['飞机','fēi jī']],入:[['入口','rù kǒu'],['进入','jìn rù']],什:[['什么','shén me'],['为什么','wèi shén me']],么:[['什么','shén me'],['那么','nà me']],古:[['古人','gǔ rén'],['古书','gǔ shū']],胡:[['胡子','hú zi'],['胡同','hú tòng']],双:[['双手','shuāng shǒu'],['一双','yì shuāng']],言:[['语言','yǔ yán'],['言语','yán yǔ']],青:[['青草','qīng cǎo'],['青蛙','qīng wā']],清:[['清水','qīng shuǐ'],['清楚','qīng chu']],晴:[['晴天','qíng tiān'],['晴朗','qíng lǎng']],苗:[['禾苗','hé miáo'],['树苗','shù miáo']],请:[['请坐','qǐng zuò'],['请问','qǐng wèn']],生:[['生日','shēng rì'],['学生','xué sheng']],字:[['汉字','hàn zì'],['写字','xiě zì']],红:[['红色','hóng sè'],['红花','hóng huā']],动:[['动物','dòng wù'],['感动','gǎn dòng']],万:[['万里','wàn lǐ'],['一万','yí wàn']],无:[['无云','wú yún'],['无数','wú shù']],明:[['明天','míng tiān'],['明白','míng bai']],告:[['告诉','gào su'],['报告','bào gào']],的:[['我的','wǒ de'],['红的','hóng de']],会:[['开会','kāi huì'],['会说','huì shuō']],北:[['北京','běi jīng'],['北方','běi fāng']],京:[['北京','běi jīng'],['京城','jīng chéng']],广:[['广场','guǎng chǎng'],['广大','guǎng dà']],走:[['走路','zǒu lù'],['走开','zǒu kāi']],河:[['小河','xiǎo hé'],['河水','hé shuǐ']],说:[['说话','shuō huà'],['听说','tīng shuō']],让:[['让路','ràng lù'],['让座','ràng zuò']],自:[['自己','zì jǐ'],['自由','zì yóu']],己:[['自己','zì jǐ'],['知己','zhī jǐ']]};
function openWords(c){$('d2t').textContent=`词组 · ${c}  ${PY[c]}`;$('d2list').innerHTML='';WORDS[c].forEach(([w,p])=>{const b=document.createElement('button');b.className='ph';b.innerHTML=`<span><span class="pp">${p}</span><span class="pw">${w.split(c).join('<b style="color:var(--hl)">'+c+'</b>')}</span></span><span class="sp">🔊</span>`;b.onclick=()=>speakText(w);$('d2list').appendChild(b)});$('dlg2').showModal()}
$('d2x').onclick=()=>$('dlg2').close();
$('dlg2').addEventListener('close',()=>{try{speechSynthesis.cancel()}catch(e){}});
$('dwords').onclick=()=>{const c=$('dlg').dataset.c;animToken++;$('dlg').close();openWords(c)};
// ---- game
let queue=[],idx=0,score=0,wrongSet=new Set(),tried=false,cur='',done=false;
$('words').onclick=()=>openWords(cur);
function start(list){queue=shuffle(list);idx=0;score=0;wrongSet=new Set();$('end').classList.add('hide');$('play').classList.remove('hide');show()}
function show(){cur=queue[idx];tried=false;done=false;$('words').classList.add('hide');$('glyph').innerHTML=staticSvg(cur);$('pg').textContent=`第 ${idx+1} / ${queue.length} 题`;$('sc').textContent=`得分 ${score}`;$('barf').style.width=(idx/queue.length*100)+'%';
 $('fb').textContent='';$('fb').style.color='';$('next').classList.add('hide');const o=$('opts');o.innerHTML='';
 makeOptions(cur).forEach(p=>{const b=document.createElement('button');b.className='opt';b.textContent=p;b.onclick=()=>pick(b,p);o.appendChild(b)})}
function pick(b,p){if(p===PY[cur]){b.classList.add('ok');[...$('opts').children].forEach(x=>x.disabled=true);if(!tried)score++;$('sc').textContent=`得分 ${score}`;
  $('fb').style.color='var(--ok)';$('fb').textContent=tried?'答对啦！':'太棒了！答对啦！';speak(cur);$('next').textContent=idx+1>=queue.length?'看成绩 ›':'下一题 ›';$('next').classList.remove('hide');done=true;$('words').classList.remove('hide');$('barf').style.width=((idx+1)/queue.length*100)+'%'}
 else{tried=true;wrongSet.add(cur);b.classList.add('bad');b.disabled=true;$('fb').style.color='var(--bad)';$('fb').textContent='再想一想，再试一次'}}
$('next').onclick=()=>{idx++;if(idx>=queue.length)finish();else show()};
function finish(){$('play').classList.add('hide');$('end').classList.remove('hide');const n=queue.length,pct=score/n;
 $('stars').textContent=pct>=.9?'⭐⭐⭐':pct>=.6?'⭐⭐':'⭐';$('final').textContent=`答对 ${score} / ${n} 题（一次答对）`;
 const w=[...wrongSet];$('wrongbox').classList.toggle('hide',!w.length);$('redo').classList.toggle('hide',!w.length);
 $('chips').innerHTML='';w.forEach(c=>{const b=document.createElement('button');b.className='chip';b.textContent=c;b.onclick=()=>openStroke(c);$('chips').appendChild(b)})}
$('stroke').onclick=()=>openStroke(cur,!done);
$('again').onclick=()=>start([...ORDER]);
$('redo').onclick=()=>start([...wrongSet]);
// ---- list & tabs
[...ORDER].forEach(c=>{const b=document.createElement('button');b.className='cell';b.setAttribute('aria-label',`${c} ${PY[c]} 笔顺`);b.innerHTML=staticSvg(c,true)+`<span>${PY[c]}</span>`;b.onclick=()=>openStroke(c);$('grid').appendChild(b)});
function tab(n){$('game').classList.toggle('hide',n!==1);$('list').classList.toggle('hide',n!==2);$('t1').setAttribute('aria-selected',n===1);$('t2').setAttribute('aria-selected',n===2)}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);
start([...ORDER]);
</script></body></html>
