<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#120d26;overflow:hidden;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
body{display:flex;align-items:center;justify-content:center;height:100dvh}
#stage{position:relative;width:min(100vw,calc(100dvh*1.5));aspect-ratio:3/2;container-type:inline-size;overflow:hidden;font-size:clamp(11px,2.3cqw,22px);user-select:none;touch-action:manipulation;cursor:none;background:#2a2150}
#bg{position:absolute;inset:0;width:100%;height:100%}
.ff{position:absolute;width:.7cqw;height:.7cqw;border-radius:50%;background:#fff6a8;box-shadow:0 0 1.2cqw .5cqw #ffe96a;animation:ff 6s ease-in-out infinite}
@keyframes ff{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(3cqw,-2.5cqw);opacity:1}}
 
.hole{position:absolute;width:18cqw;height:6cqw}
.hole .back{position:absolute;left:0;top:0;width:100%;height:5.2cqw;border-radius:50%;background:radial-gradient(#0b0716 55%,#3a2616);box-shadow:inset 0 .5cqw .8cqw #000}
.hole .gwrap{position:absolute;left:0;width:100%;bottom:calc(100% - 3.6cqw);height:16cqw;overflow:hidden}
.hole .front{position:absolute;left:-.6cqw;top:2.6cqw;width:19.2cqw;height:3.6cqw;border-radius:0 0 50% 50%/0 0 100% 100%;background:linear-gradient(#6b4a2e,#3c2716);box-shadow:0 .5cqw 0 rgba(0,0,0,.25)}
.ghost{position:absolute;left:50%;bottom:0;width:11cqw;height:13.4cqw;margin-left:-5.5cqw;transform:translateY(112%);transition:transform .22s cubic-bezier(.2,1.5,.4,1)}
.hole.up .ghost{transform:none;cursor:none}
.hole.up .ghost svg{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-.8cqw) rotate(2deg)}}
.ghost svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 1cqw rgba(200,190,255,.7))}
.lab{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);background:#fff8e1;border:.3cqw solid #7a4b1e;border-radius:1cqw;padding:.2cqw 1cqw;font-family:"Noto Serif TC","Songti TC",serif;font-weight:900;color:#3a2410;text-align:center;white-space:nowrap;line-height:1.15}
.lab i{display:block;font:700 .62em "Noto Sans TC",sans-serif;color:#a0522d}
.hole.hit .ghost{animation:hit .5s forwards}
@keyframes hit{25%{transform:scale(1.25,.5)}100%{transform:translateY(112%)}}
.hole.bad .ghost{animation:shake .12s 4}
.hole.bad .lab{background:#ffc4c4}
@keyframes shake{50%{transform:translateX(.8cqw)}}
.hole.good .lab{background:#b7ffb7;animation:glow .5s 3}
@keyframes glow{50%{transform:translateX(-50%) scale(1.25)}}
.pop{position:absolute;z-index:20;font-weight:900;font-size:3.4cqw;color:#fff;text-shadow:0 .2cqw 0 #7a4b1e,0 0 1cqw #000;pointer-events:none;animation:pop 1s forwards;transform:translateX(-50%)}
@keyframes pop{to{transform:translate(-50%,-6cqw);opacity:0}}
#hammer{position:absolute;display:none;z-index:50;pointer-events:none;font-size:8cqw;line-height:1;transform:translate(-25%,-75%) rotate(-40deg);transform-origin:70% 80%;transition:transform .07s}
#hammer.sw{transform:translate(-25%,-75%) rotate(20deg)}
 
#hud{position:absolute;left:0;right:0;top:0;height:8cqw;display:flex;align-items:center;justify-content:space-between;padding:1cqw 2cqw;z-index:10;color:#fff;font-weight:900;text-shadow:0 .2cqw .5cqw #000;font-size:1.25em}
.logobar{display:inline-block;background:rgba(255,255,255,.92);border-radius:1.2cqw;padding:.3cqw 1.2cqw}
.logo{height:5cqw;display:block}
#hud .logo{height:4.4cqw}
#tbar{position:absolute;left:0;top:8.2cqw;height:.9cqw;width:100%;background:#ffb347;z-index:10;transform-origin:left;box-shadow:0 0 1cqw #ffb347}
#bottom{position:absolute;left:0;right:0;bottom:1cqw;display:flex;gap:1.5cqw;align-items:center;justify-content:center;z-index:10;color:#fff;font-weight:700;text-shadow:0 .2cqw .5cqw #000}
 
.scr{position:absolute;inset:0;display:none;z-index:30;align-items:center;justify-content:center;background:rgba(18,12,45,.62);cursor:default}
.scr.on{display:flex}
.panel{background:#fff7e3;border:.5cqw solid #7a4b1e;border-radius:2cqw;padding:1.6cqw 3cqw;box-shadow:0 1cqw 3cqw rgba(0,0,0,.55);text-align:center;color:#3a2410;max-width:90cqw;max-height:63cqw;overflow:auto}
.panel h1{margin:.4cqw 0;font-size:2.1em;font-family:"Noto Serif TC",serif;color:#c2410c}
.panel h1 small{display:block;font-size:.45em;color:#6d28d9;letter-spacing:.1em}
.panel p{margin:.5cqw 0}
.sub{font-weight:700}
.opts{display:flex;gap:1.6cqw;justify-content:center;flex-wrap:wrap;margin:1cqw 0;font-weight:700}
select,textarea,input[type=text]{font:inherit;border:.3cqw solid #7a4b1e;border-radius:1cqw;padding:.3cqw .8cqw;background:#fff}
.row{display:flex;gap:1.2cqw;justify-content:center;flex-wrap:wrap;margin:.8cqw 0}
.btn{font:inherit;font-weight:900;padding:.7cqw 1.9cqw;border:.4cqw solid #7a4b1e;border-radius:99px;background:#ffb347;color:#3a2410;cursor:pointer;box-shadow:0 .5cqw 0 #b9722a}
.btn:active{transform:translateY(.3cqw);box-shadow:0 .2cqw 0 #b9722a}
.btn.g{background:#9be39b;box-shadow:0 .5cqw 0 #4f9a4f}.btn.p{background:#cdb8ff;box-shadow:0 .5cqw 0 #7e5fd1}.btn.s{padding:.4cqw 1.2cqw;font-size:.9em}
.btn:disabled{opacity:.45;cursor:not-allowed}
#bankTxt{width:62cqw;height:24cqw;font-size:.9em;text-align:left}
.hint{font-size:.8em;color:#7a5a3a}
.how{text-align:left;font-size:.88em;background:#fff;border:.2cqw dashed #b9722a;border-radius:1cqw;padding:.5cqw 1.5cqw;margin:.6cqw 0}.how b{color:#c2410c}.how ul{margin:.3cqw 0;padding-left:1.3em}
#langBtn{position:absolute;right:1.5cqw;bottom:1cqw;z-index:40;cursor:pointer}
#big{font-size:2.2em;font-weight:900;color:#c2410c}
.wl{max-height:15cqw;overflow:auto;text-align:left;font-size:.85em;background:#fff;border:.2cqw dashed #b9722a;border-radius:1cqw;padding:.5cqw 1.2cqw;margin:.6cqw 0}
#toast{position:absolute;left:50%;top:10cqw;transform:translateX(-50%);background:#3a2410;color:#fff;padding:.6cqw 2cqw;border-radius:99px;z-index:60;display:none;font-weight:700}
</style></head>

let LANG='zh';try{LANG=localStorage.getItem('tcml_ghost_lang')||'zh'}catch(e){}
const t=k=>T[LANG][k];
function applyLang(){document.documentElement.lang=LANG==='en'?'en':'zh-Hant';
['title','sub','howT','lN','oAll','lV','vTW','vCN','lPy','bPlay','bBank','bDl','bankT','bankH','bImp','bSave','bExp','bSample','bReset','bClose','hintTxt','bRe','resT','lNm','bRep','bAgain','bHome'].forEach(k=>$(k).textContent=t(k));
$('howL').innerHTML=t('how').map(x=>'<li>'+x+'</li>').join('');$('nm').placeholder=t('nmPh');$('langBtn').textContent=t('lang');setInfo();setQN();renderResult()}
function setInfo(){$('bankInfo').textContent=t('info')(BANK.length)}
function setQN(){if(G&&G.qs)$('qn').textContent=t('qn')(Math.min(G.i+1,G.qs.length),G.qs.length)}
 
function parseBank(txt){const seen=new Set(),out=[];txt.replace(/^\ufeff/,'').split(/\r?\n/).forEach(l=>{l=l.trim();if(!l||l[0]==='#'||l[0]==='＃')return;const p=l.split(/[,，\t]/).map(s=>s.trim());if(p[0]&&!seen.has(p[0])){seen.add(p[0]);out.push({w:p[0],py:p[1]||'',en:p.slice(2).join(', ')})}});return out}
const bankToTxt=b=>b.map(x=>[x.w,x.py,x.en].join(',').replace(/,+$/,'')).join('\n');
function setBank(b,save){BANK=b;$('bankTxt').value=bankToTxt(b);setInfo();if(save)try{localStorage.setItem(LS,JSON.stringify(b))}catch(e){}}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'text/plain;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function importFile(f){const r=new FileReader();r.onload=()=>{const buf=new Uint8Array(r.result);let enc='utf-8';if(buf[0]===0xFF&&buf[1]===0xFE)enc='utf-16le';else if(buf[0]===0xFE&&buf[1]===0xFF)enc='utf-16be';const b=parseBank(new TextDecoder(enc).decode(buf));if(b.length<3){alert(t('need3'));return}setBank(b,true);toast(t('imp')(b.length))};r.readAsArrayBuffer(f)}
function downloadGame(){let h=PRISTINE.replace(/\/\*BANK_S\*\/[\s\S]*?\/\*BANK_E\*\//,()=>'/*BANK_S*/[{"w":"走进","py":"zǒu jìn","en":""},{"w":"自己","py":"zì jǐ","en":""},{"w":"小河","py":"xiǎo hé","en":""},{"w":"忽然","py":"hū rán","en":""},{"w":"背上","py":"bèi shàng","en":""},{"w":"急得直哭","py":"jí de zhí kū","en":""},{"w":"告诉","py":"gào su","en":""},{"w":"非常","py":"fēi cháng","en":""},{"w":"广场","py":"guǎng chǎng","en":""},{"w":"北京","py":"běi jīng","en":""},{"w":"美丽","py":"měi lì","en":""},{"w":"字谜","py":"zì mí","en":""},{"w":"喜欢","py":"xǐ huan","en":""},{"w":"感动","py":"gǎn dòng","en":""},{"w":"万里","py":"wàn lǐ","en":""},{"w":"眼睛","py":"yǎn jing","en":""},{"w":"事情","py":"shì qing","en":""},{"w":"保护","py":"bǎo hù","en":""},{"w":"禾苗","py":"hé miáo","en":""},{"w":"生病","py":"shēng bìng","en":""},{"w":"姓氏","py":"xìng shì","en":""},{"w":"飞鸟","py":"fēi niǎo","en":""},{"w":"红花","py":"hóng huā","en":""},{"w":"青草","py":"qīng cǎo","en":""}]/*BANK_E*/').replace(/\/\*EMB\*\/\d\/\*EMB_E\*\//,'/*EMB*/1/*EMB_E*/');dl('halloween_ghost_whack_with_bank.html',h,'text/html;charset=utf-8')}

 
const COLS=[22,50,78],ROWS=[33,45,57];
function ghostSVG(v){const c=['#ffffff','#f3e8ff','#e6fff4','#fff1e0'][v%4],acc=[ '','<path d="M26 24 L50 -22 L74 24Z" fill="#2b1d4a"/><rect x="18" y="22" width="64" height="9" rx="4" fill="#2b1d4a"/><rect x="34" y="14" width="32" height="6" fill="#f08a24"/>','<ellipse cx="50" cy="6" rx="18" ry="11" fill="#f08a24"/><path d="M50 -5 q2-9 9-8" stroke="#3b6e2b" stroke-width="4" fill="none"/>','<path d="M18 22 L24 -6 L42 12Z M82 22 L76 -6 L58 12Z" fill="#f08a24"/>'][v%4];
return `<svg viewBox="0 -24 100 144"><path d="M10 112V52C10 22 28 6 50 6s40 16 40 46v60l-13-12-14 14-13-12-13 12-14-14-13 12z" fill="${c}" stroke="#6a5a8a" stroke-width="3" stroke-linejoin="round"/>${acc}<ellipse cx="37" cy="54" rx="7" ry="9" fill="#2a2140"/><ellipse cx="63" cy="54" rx="7" ry="9" fill="#2a2140"/><circle cx="39" cy="50" r="2.6" fill="#fff"/><circle cx="65" cy="50" r="2.6" fill="#fff"/><ellipse cx="26" cy="68" rx="6" ry="4" fill="#ff9db5" opacity=".7"/><ellipse cx="74" cy="68" rx="6" ry="4" fill="#ff9db5" opacity=".7"/><ellipse cx="50" cy="72" rx="5" ry="6" fill="#2a2140"/></svg>`}
function buildScene(){const hs=$('holes');ROWS.forEach(y=>COLS.forEach(x=>{const el=document.createElement('div');el.className='hole';el.style.left=(x-9)+'cqw';el.style.top=(y-3)+'cqw';el.innerHTML='<div class="back"></div><div class="gwrap"><div class="ghost"></div></div><div class="front"></div>';hs.appendChild(el);holes.push({el,gh:el.querySelector('.ghost'),x,y,g:null})}));
for(let i=0;i<12;i++){const f=document.createElement('div');f.className='ff';f.style.left=rand(3,95)+'cqw';f.style.top=rand(22,60)+'cqw';f.style.animationDelay=rand(0,6)+'s';f.style.animationDuration=rand(4,8)+'s';$('ffs').appendChild(f)}}

/* ---------- game ---------- */
function startGame(){if(BANK.length<3){alert(t('need3'));return}
VOICE=$('optV').value;SHOWPY=$('optPy').checked;let n=+$('optN').value;if(!n||n>BANK.length)n=BANK.length;
G={qs:shuf(BANK).slice(0,n),i:0,score:0,correct:0,log:[],active:false,gs:[],timers:[]};
$('start').classList.remove('on');$('result').classList.remove('on');nextQ()}
function clearT(){if(!G)return;G.timers.forEach(clearTimeout);G.timers=[];G.gs.forEach(g=>clearTimeout(g.t))}
function later(fn,ms){const t=setTimeout(fn,ms);G.timers.push(t);return t}
function nextQ(){holes.forEach(h=>{h.g=null;h.el.className='hole'});clearT();G.gs=[];
if(G.i>=G.qs.length)return finish();
const q=G.qs[G.i];G.q=q;G.active=true;G.t0=Date.now();
setQN();$('sc').textContent='⭐ '+G.score;
const bar=$('tbar');bar.style.transition='none';bar.style.transform='scaleX(1)';void bar.offsetWidth;bar.style.transition='transform '+QTIME+'ms linear';bar.style.transform='scaleX(0)';
const ds=shuf(BANK.filter(b=>b.w!==q.w)).slice(0,Math.min(3,BANK.length-1));
G.gs=shuf([q,...ds]).map((b,i)=>({b,w:b.w,v:Math.random()*4|0,h:null,t:0}));
G.gs.forEach((g,i)=>g.t=setTimeout(()=>popGhost(g),400+i*220));
later(()=>resolve(null),QTIME+400);later(()=>speak(q.w),350)}
function popGhost(g){if(!G||!G.active)return;const free=holes.filter(h=>!h.g);if(!free.length){g.t=setTimeout(()=>popGhost(g),400);return}
const h=free[Math.random()*free.length|0],b=g.b,len=b.w.length;h.g=g;g.h=h;
h.gh.innerHTML=ghostSVG(g.v)+`<div class="lab" style="font-size:${len>6?1.5:len>4?1.9:2.6}cqw">${b.w}${SHOWPY&&b.py?'<i>'+b.py+'</i>':''}</div>`;
h.el.classList.add('up');g.t=setTimeout(()=>hideGhost(g,true),rand(2600,4200))}
function hideGhost(g,again){const h=g.h;if(h){h.el.classList.remove('up');h.g=null;g.h=null}if(again&&G&&G.active)g.t=setTimeout(()=>popGhost(g),rand(500,1100))}
function popText(h,t){const d=document.createElement('div');d.className='pop';d.textContent=t;d.style.left=h.x+'cqw';d.style.top=(h.y-12)+'cqw';$('fx').appendChild(d);setTimeout(()=>d.remove(),1000)}
function resolve(hit){if(!G||!G.active)return;G.active=false;clearT();const q=G.q,ok=!!hit&&hit.g.w===q.w,left=Math.max(0,QTIME-(Date.now()-G.t0));
$('tbar').style.transition='none';
if(ok){const pts=10+Math.round(left/QTIME*5);G.score+=pts;G.correct++;hit.el.classList.add('hit');sfx.ok();popText(hit,'+'+pts+' ✨')}
else{if(hit){hit.el.classList.add('bad');popText(hit,t('nope'))}else toast(t('timeup'));sfx.bad();
const cg=G.gs.find(g=>g.w===q.w);if(cg){if(!cg.h){const free=holes.filter(h=>!h.g);if(free.length){cg.h=free[0];free[0].g=cg;popGhostAt(cg,free[0])}}if(cg.h)cg.h.el.classList.add('good','up')}speak(q.w)}
G.log.push({w:q.w,py:q.py,en:q.en,ok,ans:ok?q.w:(hit?hit.g.w:t('to'))});
$('sc').textContent='⭐ '+G.score;G.i++;later(nextQ,ok?1000:2000)}
function popGhostAt(g,h){const b=g.b,len=b.w.length;h.gh.innerHTML=ghostSVG(g.v)+`<div class="lab" style="font-size:${len>6?1.5:len>4?1.9:2.6}cqw">${b.w}${SHOWPY&&b.py?'<i>'+b.py+'</i>':''}</div>`;h.el.classList.add('up')}
function finish(){const n=G.qs.length;lastRes={n,pct:Math.round(G.correct/n*100),score:G.score,correct:G.correct,log:G.log};$('nm').value='';$('bRep').disabled=true;renderResult();$('result').classList.add('on')}
function renderResult(){if(!lastRes)return;const{n,pct,score,correct,log}=lastRes;
$('big').textContent=score+t('pts');$('rsum').textContent=t('sum')(correct,n,pct);$('rmsg').textContent=t('m')[pct>=90?0:pct>=70?1:pct>=50?2:3];
const bad=log.filter(x=>!x.ok);$('wl').innerHTML=bad.length?'<b>'+t('rev')+'</b><br>'+bad.map(x=>`✖ ${x.w} ${x.py}${x.en?' ('+x.en+')':''} → ${t('hit')}${x.ans}`).join('<br>'):t('perfect')}
function report(){const name=$('nm').value.trim(),r=lastRes,d=new Date(),p=n=>String(n).padStart(2,'0');
const t=['TCML Union Mandarin School','打擊魔鬼 語詞聽音打鬼 成績報告 / Ghost Whack Score Report','==============================','姓名 Name:'+name,'日期 Date:'+d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()),'題數 Questions:'+r.n,'得分 Score:'+r.score,'答對 Correct:'+r.correct+' / '+r.n+'(正確率 '+r.pct+'%)','','--- 明細 Details ---',...r.log.map((x,i)=>(i+1)+'. '+x.w+(x.py?' ('+x.py+')':'')+(x.en?' '+x.en:'')+'  '+(x.ok?'✔ 答對 Correct':'✖ 答錯 Wrong — 你打了 You hit: '+x.ans))].join('\r\n');
dl('成績報告_'+name.replace(/[\\\/:*?"<>|\s]/g,'')+'.txt','\ufeff'+t)}

 
document.querySelectorAll('.logo').forEach(i=>i.src=LOGO);
buildScene();
try{const s=JSON.parse(localStorage.getItem(LS)||'null');setBank(!EMBED&&Array.isArray(s)&&s.length>=3?s:DEFAULT_BANK,false)}catch(e){setBank(DEFAULT_BANK,false)}
if('speechSynthesis'in window)speechSynthesis.getVoices();
$('langBtn').onclick=()=>{LANG=LANG==='zh'?'en':'zh';try{localStorage.setItem('tcml_ghost_lang',LANG)}catch(e){};applyLang()};applyLang();
$('bPlay').onclick=startGame;$('bAgain').onclick=startGame;
$('bHome').onclick=()=>{clearT();if(G)G.active=false;$('result').classList.remove('on');$('start').classList.add('on')};
$('bBank').onclick=()=>{$('bankTxt').value=bankToTxt(BANK);$('bank').classList.add('on')};
$('bClose').onclick=()=>$('bank').classList.remove('on');
$('bImp').onclick=()=>$('file').click();$('file').onchange=e=>{if(e.target.files[0])importFile(e.target.files[0]);e.target.value=''};
$('bSave').onclick=()=>{const b=parseBank($('bankTxt').value);if(b.length<3){alert(t('need3'));return}setBank(b,true);toast(t('sav')(b.length))};
$('bExp').onclick=()=>dl('題庫.txt','\ufeff'+bankToTxt(parseBank($('bankTxt').value)));
$('bSample').onclick=()=>dl('題庫範例.txt','\ufeff# 打擊魔鬼 題庫範例:詞語,拼音,英文\r\n'+bankToTxt(DEFAULT_BANK).replace(/\n/g,'\r\n'));
$('bReset').onclick=()=>{if(confirm(t('rst')))setBank(DEFAULT_BANK,true)};
$('bDl').onclick=downloadGame;
$('bRe').onclick=()=>{if(G&&G.q&&G.active)speak(G.q.w)};
$('nm').oninput=()=>$('bRep').disabled=!$('nm').value.trim();$('bRep').onclick=()=>{if($('nm').value.trim())report()};
 
const stage=$('stage'),hm=$('hammer');
function moveH(e){const r=stage.getBoundingClientRect();hm.style.left=(e.clientX-r.left)+'px';hm.style.top=(e.clientY-r.top)+'px'}
stage.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){hm.style.display='block';moveH(e)}});
stage.addEventListener('pointerleave',()=>hm.style.display='none');
stage.addEventListener('pointerdown',e=>{if(e.target.closest('.scr'))return;moveH(e);hm.style.display='block';hm.classList.add('sw');setTimeout(()=>{hm.classList.remove('sw');if(e.pointerType!=='mouse')hm.style.display='none'},140);
const el=e.target.closest('.hole');if(!el||!G||!G.active)return;const h=holes.find(x=>x.el===el);if(h&&h.g&&el.classList.contains('up')){sfx.hit();resolve(h)}});
</script></body></html>
